<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>C · Termin-Detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Figtree, system-ui, sans-serif; font-size: 16px">

  <main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column">
    <section aria-labelledby="c-title" style="display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 22px; border-radius: 0 0 32px 32px; background: {{t.trainingTile}}; color: {{t.trainingInk}}">
      <div style="display: flex; justify-content: space-between">
        <a href="C-Start.dc.html" aria-label="Zurück" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 16px; background: {{t.surface}}; color: {{t.ink}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </a>
        <button type="button" aria-label="Route zum Sportpark" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 16px; border: 0; background: {{t.surface}}; color: {{t.ink}}; font-family: Figtree, sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Route
        </button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 800; font-size: 14px; color: {{t.trainingText}}">Training · morgen</span>
        <h1 id="c-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.02em; line-height: 1.05">Freitag, 18:30</h1>
        <span style="font-size: 15px; color: {{t.trainingSub}}">bis 20:00 · Sportpark, Platz 2</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span style="padding: 6px 12px; border-radius: 999px; background: {{t.surface}}; color: {{t.ink}}; font-size: 13px; font-weight: 700">Antworten bis 16:30</span>
        <span style="padding: 6px 12px; border-radius: 999px; background: {{t.surface}}; color: {{t.ink}}; font-size: 13px; font-weight: 700">6 dabei · 1 vielleicht</span>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 18px 16px 24px">
      <div role="tablist" aria-label="Bereiche" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: {{t.track}}">
        <sc-for list="{{tabs}}" as="s" hint-placeholder-count="2">
          <button type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="min-height: 44px; border: 0; border-radius: 12px; background: {{s.bg}}; color: {{t.ink}}; font-family: Figtree, sans-serif; font-weight: {{s.weight}}; font-size: 15px; cursor: pointer">{{s.label}}</button>
        </sc-for>
      </div>

      <sc-if value="{{showFlow}}" hint-placeholder-val="{{true}}">
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{drills}}" as="d" hint-placeholder-count="3">
            <li>
              <a href="#uebung" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 22px; background: {{t.surface}}; color: inherit; text-decoration: none">
                <span style="display: grid; place-items: center; width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: {{d.tileBg}}">
                  <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3L3 6l2 4 3-1.5V21h8V8.5l3 1.5 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z" fill="{{d.bib}}"></path></svg>
                </span>
                <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                  <strong style="font-size: 16px">{{d.title}}</strong>
                  <span style="font-size: 14px; color: {{t.muted}}">{{d.meta}}</span>
                </span>
                <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; color: {{t.muted}}">{{d.min}}′</span>
              </a>
            </li>
          </sc-for>
        </ol>
      </sc-if>
      <sc-if value="{{showWho}}" hint-placeholder-val="{{false}}">
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
            <li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: {{t.surface}}">
              <span style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: {{p.c}}; color: #FFFFFF; font-weight: 800">{{p.n}}</span>
              <span style="flex: 1; font-weight: 700">{{p.name}}</span>
              <span style="font-size: 14px; font-weight: 700; color: {{p.stateColor}}">{{p.state}}</span>
            </li>
          </sc-for>
        </ul>
      </sc-if>
    </div>
  </main>

  <div role="group" aria-label="Bist du dabei?" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 24px; background: {{t.surface}}; box-shadow: 0 -6px 20px rgba(0,0,0,0.06)">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: Figtree, sans-serif; font-weight: 800; font-size: 15px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>{{o.label}}
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
var THEMES = {
  light: { bg: '#F2F3F6', surface: '#FFFFFF', ink: '#1A1D26', muted: '#5A6070', line: '#D9DCE3', track: '#E3E6EC', segOn: '#FFFFFF', trainingTile: '#D7F0DF', trainingInk: '#0E3B22', trainingSub: '#2C5A3E', trainingText: '#166534', grayTile: '#ECEEF2', redTile: '#FDE2E2', blueTile: '#DCE6FF', yes: '#15803D', maybe: '#B45309', no: '#B91C1C', yesText: '#166534', maybeText: '#92400E', noText: '#991B1B' },
  dark: { bg: '#101217', surface: '#1A1D25', ink: '#EEF0F4', muted: '#A4AABA', line: '#2C303B', track: '#222631', segOn: '#343947', trainingTile: '#173523', trainingInk: '#DDF7E6', trainingSub: '#B4D9C0', trainingText: '#4ADE80', grayTile: '#262A34', redTile: '#3A1D1F', blueTile: '#1A2647', yes: '#15803D', maybe: '#B45309', no: '#B91C1C', yesText: '#4ADE80', maybeText: '#FBBF24', noText: '#FCA5A5' }
};
var ICONS = { yes: 'M5 12.5l4.5 4.5L19 7.5', maybe: 'M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.1-1.5 2.1V15 M12 19h.01', no: 'M6 6l12 12M18 6L6 18' };
var LABELS = { yes: 'Dabei', maybe: 'Vielleicht', no: 'Absage' };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answer: 'yes', tab: 0 };
  }
  renderVals() {
    var self = this;
    var t = this.props.dark ? THEMES.dark : THEMES.light;
    var opts = ['yes', 'maybe', 'no'].map(function (v) {
      var on = self.state.answer === v;
      return { label: LABELS[v], icon: ICONS[v], pressed: on, pick: function () { self.setState({ answer: on ? null : v }); }, bg: on ? t[v] : 'transparent', fg: on ? '#FFFFFF' : t.ink, border: on ? t[v] : t.line };
    });
    var tabs = ['Ablauf', 'Wer kommt'].map(function (l, i) {
      var on = self.state.tab === i;
      return { label: l, on: on, pick: function () { self.setState({ tab: i }); }, bg: on ? t.segOn : 'transparent', weight: on ? 800 : 600 };
    });
    return {
      t: t, opts: opts, tabs: tabs,
      showFlow: this.state.tab === 0,
      showWho: this.state.tab === 1,
      drills: [
        { title: 'Aufwärmen mit Ball', meta: 'Alle zusammen', min: 10, bib: '#9AA3B2', tileBg: t.grayTile },
        { title: 'Rondo 4 gegen 2', meta: 'Du bist Rot · Animation', min: 15, bib: '#EF4444', tileBg: t.redTile },
        { title: 'Abschlussspiel 7 gegen 7', meta: 'Du bist Blau', min: 25, bib: '#3B82F6', tileBg: t.blueTile }
      ],
      people: [
        { n: '10', name: 'Pia (du)', c: '#0F766E', state: '✓ Dabei', stateColor: t.yesText },
        { n: '1', name: 'Lena', c: '#7C3AED', state: '✓ Dabei', stateColor: t.yesText },
        { n: '11', name: 'Finn', c: '#B45309', state: '? Vielleicht', stateColor: t.maybeText },
        { n: '5', name: 'Ben', c: '#1D4ED8', state: '✕ Verletzt', stateColor: t.noText }
      ]
    };
  }
}
</script>
</body>
</html>
