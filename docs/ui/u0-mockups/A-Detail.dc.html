<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A · Termin-Detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Barlow, system-ui, sans-serif; font-size: 16px">

  <main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column">
    <section aria-labelledby="ev-title" style="position: relative; overflow: hidden; background: {{t.pitch}}; color: #ffffff; padding: 10px 16px 22px">
      <svg width="390" height="260" viewBox="0 0 390 260" aria-hidden="true" style="position: absolute; left: 0; top: 0; opacity: 0.12"><rect x="-40" y="30" width="470" height="300" fill="none" stroke="#ffffff" stroke-width="3"></rect><path d="M195 30v300" stroke="#ffffff" stroke-width="3"></path><circle cx="195" cy="180" r="62" fill="none" stroke="#ffffff" stroke-width="3"></circle></svg>
      <div style="position: relative; display: flex; align-items: center; justify-content: space-between">
        <a href="Main.dc.html" aria-label="Zurück" style="display: grid; place-items: center; width: 44px; height: 44px; margin-left: -8px; color: #ffffff">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </a>
        <button type="button" aria-label="Teilen" style="display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: none; color: #ffffff; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12 M7.5 7.5L12 3l4.5 4.5 M5 13v7h14v-7"></path></svg>
        </button>
      </div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 10px; margin-top: 6px">
        <span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.16); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.06em">TRAINING</span>
        <h1 id="ev-title" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.95">Freitag 16.10.<br>18:30 – 20:00</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; font-weight: 500">
          <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Sportpark, Platz 2</span>
          <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Antworten bis 16:30</span>
        </div>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 22px; padding: 18px 16px 24px">
      <p style="margin: 0; display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: {{t.surface}}; font-size: 15px; line-height: 1.4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M4 5h16v11H8l-4 4z"></path></svg>
        Bitte Schienbeinschoner mitbringen.
      </p>

      <section aria-labelledby="flow-title" style="display: flex; flex-direction: column; gap: 12px">
        <h2 id="flow-title" style="margin: 0; display: flex; justify-content: space-between; align-items: baseline; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800">Ablauf <span style="font-family: Barlow, sans-serif; font-size: 14px; font-weight: 600; color: {{t.muted}}">50 Min.</span></h2>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{drills}}" as="d" hint-placeholder-count="3">
            <li style="display: flex; gap: 12px">
              <div style="display: flex; flex-direction: column; align-items: center; width: 36px; flex-shrink: 0">
                <span style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: {{t.pitch}}; color: #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px">{{d.n}}</span>
                <span style="flex: 1; width: 2px; min-height: 14px; background: {{d.line}}"></span>
              </div>
              <a href="#uebung" style="flex: 1; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 12px; border-radius: 16px; background: {{t.surface}}; color: inherit; text-decoration: none">
                <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                  <strong style="font-size: 16px">{{d.title}}</strong>
                  <span style="font-size: 13px; color: {{t.muted}}">{{d.meta}}</span>
                </span>
                <sc-if value="{{d.hasBib}}" hint-placeholder-val="{{true}}">
                  <span style="display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; border-radius: 999px; border: 2px solid {{d.bib}}; font-weight: 700; font-size: 15px">
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3L3 6l2 4 3-1.5V21h8V8.5l3 1.5 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z" fill="{{d.bib}}"></path></svg>
                    {{d.bibName}}
                  </span>
                </sc-if>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </a>
            </li>
          </sc-for>
        </ol>
      </section>

      <section aria-labelledby="who-title" style="display: flex; flex-direction: column; gap: 10px">
        <h2 id="who-title" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800">Wer kommt</h2>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: {{t.surface}}">
          <div style="display: flex">
            <sc-for list="{{faces}}" as="f" hint-placeholder-count="5">
              <span style="display: grid; place-items: center; width: 34px; height: 34px; margin-right: -8px; border-radius: 50%; border: 2px solid {{t.surface}}; background: {{t.pitch}}; color: #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px">{{f}}</span>
            </sc-for>
          </div>
          <span style="flex: 1; padding-left: 10px; font-size: 15px"><strong>6 dabei</strong> · 1 vielleicht · 1 nicht</span>
        </div>
      </section>
    </div>
  </main>

  <div style="padding: 12px 16px 24px; background: {{t.surface}}; border-top: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Bist du dabei?</div>
    <div role="group" aria-label="Bist du dabei?" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 54px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 14px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: Barlow, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>
          {{o.label}}
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
var THEMES = {
  light: { bg: '#EDF1EC', surface: '#FFFFFF', ink: '#0F1A14', muted: '#55625A', line: '#D7DED5', pitch: '#0B4A30', yes: '#15803D', maybe: '#B45309', no: '#B91C1C' },
  dark: { bg: '#0A110D', surface: '#141D18', ink: '#E7EEE9', muted: '#9DAEA3', line: '#26332B', pitch: '#0E4B32', yes: '#15803D', maybe: '#B45309', no: '#B91C1C' }
};
var ICONS = { yes: 'M5 12.5l4.5 4.5L19 7.5', maybe: 'M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.1-1.5 2.1V15 M12 19h.01', no: 'M6 6l12 12M18 6L6 18' };
var LABELS = { yes: 'Zusage', maybe: 'Vielleicht', no: 'Absage' };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answer: 'yes' };
  }
  renderVals() {
    var self = this;
    var t = this.props.dark ? THEMES.dark : THEMES.light;
    var opts = ['yes', 'maybe', 'no'].map(function (v) {
      var on = self.state.answer === v;
      return {
        label: LABELS[v], icon: ICONS[v], pressed: on,
        pick: function () { self.setState({ answer: on ? null : v }); },
        bg: on ? t[v] : 'transparent', fg: on ? '#FFFFFF' : t.ink, border: on ? t[v] : t.line
      };
    });
    return {
      t: t,
      opts: opts,
      faces: ['10', '1', '4', '6', '8'],
      drills: [
        { n: '1', title: 'Aufwärmen mit Ball', meta: '10 Min. · alle zusammen', hasBib: false, line: t.line },
        { n: '2', title: 'Rondo 4 gegen 2', meta: '15 Min. · Animation', hasBib: true, bib: '#EF4444', bibName: 'Rot', line: t.line },
        { n: '3', title: 'Abschlussspiel 7 gegen 7', meta: '25 Min.', hasBib: true, bib: '#3B82F6', bibName: 'Blau', line: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
