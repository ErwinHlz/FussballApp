<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B · Plan-Editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Manrope, system-ui, sans-serif; font-size: 16px">

  <header style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="B-Detail.dc.html" aria-label="Zurück" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: {{t.surface}}; color: {{t.ink}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.05">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: {{t.trainingText}}">TRAINING</span>
        <h1 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-size: 28px">Fr 16.10. · 18:30</h1>
      </div>
      <button type="button" aria-label="Weitere Aktionen: kopieren, Vorlage, Notizen" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: {{t.surface}}; color: {{t.ink}}; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
      </button>
    </div>
    <div role="tablist" aria-label="Bereiche" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: {{t.track}}">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="min-height: 40px; border: 0; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; font-family: Manrope, sans-serif; font-weight: {{s.weight}}; font-size: 13px; cursor: pointer">{{s.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">{{total}} <span style="font-size: 20px; color: {{t.muted}}">/ 90 Min.</span></span>
        <span style="font-size: 14px; font-weight: 700; color: {{fitColor}}">{{fitText}}</span>
      </div>
      <div aria-hidden="true" style="height: 10px; border-radius: 999px; background: {{t.track}}; overflow: hidden">
        <div style="height: 100%; width: {{barWidth}}; border-radius: 999px; background: {{fitColor}}"></div>
      </div>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{drills}}" as="d" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 8px; padding: 10px 6px 10px 2px; border-radius: 18px; background: {{t.surface}}">
          <button type="button" aria-label="{{d.moveLabel}}" style="display: grid; place-items: center; width: 32px; height: 44px; border: 0; background: none; color: {{t.muted}}; cursor: grab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
          </button>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <strong style="font-size: 15px; line-height: 1.2">{{d.title}}</strong>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{t.muted}}">
              {{d.cat}}
              <sc-if value="{{d.hasGroups}}" hint-placeholder-val="{{true}}">
                <span style="display: flex; gap: 3px" role="img" aria-label="Gruppen Rot und Blau">
                  <span style="width: 12px; height: 12px; border-radius: 3px; background: #EF4444"></span>
                  <span style="width: 12px; height: 12px; border-radius: 3px; background: #3B82F6"></span>
                </span>
              </sc-if>
            </span>
          </div>
          <div role="group" aria-label="{{d.durLabel}}" style="display: flex; align-items: center; border-radius: 999px; border: 2px solid {{t.line}}">
            <button type="button" aria-label="5 Minuten weniger" onClick="{{d.dec}}" style="width: 36px; height: 40px; border: 0; background: none; color: {{t.ink}}; font-size: 20px; font-weight: 800; cursor: pointer">−</button>
            <span style="min-width: 28px; text-align: center; font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-size: 20px">{{d.min}}</span>
            <button type="button" aria-label="5 Minuten mehr" onClick="{{d.inc}}" style="width: 36px; height: 40px; border: 0; background: none; color: {{t.ink}}; font-size: 20px; font-weight: 800; cursor: pointer">+</button>
          </div>
          <button type="button" aria-label="{{d.moreLabel}}" style="display: grid; place-items: center; width: 34px; height: 44px; border: 0; background: none; color: {{t.muted}}; cursor: pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
          </button>
        </li>
      </sc-for>
    </ol>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 18px; border: 2px dashed {{t.dash}}; background: transparent; color: {{t.link}}; font-family: Manrope, sans-serif; font-weight: 800; font-size: 16px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Übung hinzufügen
    </button>
    <p style="margin: 0; text-align: center; font-size: 13px; color: {{t.muted}}">Kopieren, Vorlagen und Notizen unter ⋯</p>
  </main>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 24px; background: {{t.bar}}; border-top: 1px solid {{t.line}}">
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.25">
      <strong style="display: flex; align-items: center; gap: 6px; font-size: 15px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: {{dot}}"></span>{{statusTitle}}</strong>
      <span style="font-size: 13px; color: {{t.muted}}">{{statusText}}</span>
    </span>
    <button type="button" onClick="{{togglePublish}}" style="min-height: 52px; padding: 0 20px; border-radius: 16px; border: 2px solid {{pubBorder}}; background: {{pubBg}}; color: {{pubFg}}; font-family: Manrope, sans-serif; font-weight: 800; font-size: 16px; cursor: pointer">{{pubLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
var THEMES = {
  dark: { bg: '#0F1412', surface: '#171F1A', bar: '#141B17', ink: '#EEF2EC', muted: '#A1ADA5', line: '#2E3A32', track: '#222C25', dash: 'rgba(238,242,236,0.28)', accent: '#C6F25B', accentInk: '#16210A', ok: '#C6F25B', warn: '#FBBF24', segOn: '#EEF2EC', segOnInk: '#0F1412', link: '#C6F25B', trainingText: '#C6F25B' },
  light: { bg: '#F3F5F0', surface: '#FFFFFF', bar: '#FFFFFF', ink: '#121815', muted: '#56615A', line: '#D5DBD3', track: '#E2E7DF', dash: 'rgba(18,24,21,0.28)', accent: '#3F6212', accentInk: '#FFFFFF', ok: '#3F6212', warn: '#92400E', segOn: '#121815', segOnInk: '#FFFFFF', link: '#3F6212', trainingText: '#3F6212' }
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { seg: 0, mins: [10, 15, 25], published: false };
  }
  renderVals() {
    var self = this;
    var t = this.props.light ? THEMES.light : THEMES.dark;
    var mins = this.state.mins;
    var total = mins.reduce(function (a, b) { return a + b; }, 0);
    var fits = total >= 80 && total <= 90;
    var segs = ['Plan', 'Gruppen', 'Wer kommt', 'Infos'].map(function (l, i) {
      var on = self.state.seg === i;
      return { label: l, on: on, pick: function () { self.setState({ seg: i }); }, bg: on ? t.segOn : 'transparent', fg: on ? t.segOnInk : t.ink, weight: on ? 800 : 600 };
    });
    var base = [
      { title: 'Aufwärmen mit Ball', cat: 'Aufwärmen', hasGroups: false },
      { title: 'Rondo 4 gegen 2', cat: 'Ballbesitz', hasGroups: true },
      { title: 'Abschlussspiel 7 gegen 7', cat: 'Spielform', hasGroups: true }
    ];
    var drills = base.map(function (d, i) {
      var m = mins[i];
      var set = function (delta) { var ms = mins.slice(); ms[i] = Math.max(5, Math.min(60, ms[i] + delta)); self.setState({ mins: ms }); };
      return {
        title: d.title, cat: d.cat, hasGroups: d.hasGroups, min: m,
        durLabel: 'Dauer ' + d.title + ': ' + m + ' Minuten',
        moveLabel: d.title + ' verschieben',
        moreLabel: 'Aktionen für ' + d.title,
        dec: function () { set(-5); }, inc: function () { set(5); }
      };
    });
    var pub = this.state.published;
    return {
      t: t, segs: segs, drills: drills, total: total,
      barWidth: Math.min(100, Math.round(total / 90 * 100)) + '%',
      fitText: total > 90 ? (total - 90) + ' Min. zu lang' : fits ? 'passt' : 'noch ' + (90 - total) + ' Min. frei',
      fitColor: fits ? t.ok : t.warn,
      dot: pub ? t.ok : t.warn,
      statusTitle: pub ? 'Veröffentlicht' : 'Entwurf',
      statusText: pub ? 'Spieler sehen den Plan' : 'Nur Trainer sehen den Plan',
      pubLabel: pub ? 'Zurückziehen' : 'Veröffentlichen',
      pubBg: pub ? 'transparent' : t.accent,
      pubFg: pub ? t.ink : t.accentInk,
      pubBorder: pub ? t.line : t.accent,
      togglePublish: function () { self.setState({ published: !pub }); }
    };
  }
}
</script>
</body>
</html>
