<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A · Plan-Editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Barlow, system-ui, sans-serif; font-size: 16px">

  <header style="display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 0; background: {{t.bg}}">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="#zurueck" aria-label="Zurück" style="display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; color: {{t.ink}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.05">
        <span style="font-size: 13px; font-weight: 600; color: {{t.trainingText}}">TRAINING</span>
        <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px">Fr 16.10. · 18:30</h1>
      </div>
      <button type="button" aria-label="Weitere Aktionen" style="display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: none; color: {{t.ink}}; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
      </button>
    </div>
    <div role="tablist" aria-label="Bereiche" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: {{t.track}}">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="min-height: 40px; border: 0; border-radius: 10px; background: {{s.bg}}; color: {{s.fg}}; font-family: Barlow, sans-serif; font-weight: {{s.weight}}; font-size: 14px; cursor: pointer; box-shadow: {{s.shadow}}">{{s.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px">{{total}} <span style="font-size: 20px; color: {{t.muted}}">/ 90 Min.</span></span>
        <span style="font-size: 14px; font-weight: 600; color: {{fitColor}}">{{fitText}}</span>
      </div>
      <div aria-hidden="true" style="height: 10px; border-radius: 999px; background: {{t.track}}; overflow: hidden">
        <div style="height: 100%; width: {{barWidth}}; border-radius: 999px; background: {{fitBar}}"></div>
      </div>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{drills}}" as="d" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 4px; border-radius: 16px; background: {{t.surface}}">
          <button type="button" aria-label="{{d.moveLabel}}" style="display: grid; place-items: center; width: 32px; height: 44px; border: 0; background: none; color: {{t.muted}}; cursor: grab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
          </button>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <strong style="font-size: 16px; line-height: 1.2">{{d.title}}</strong>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{t.muted}}">
              {{d.cat}}
              <sc-if value="{{d.hasGroups}}" hint-placeholder-val="{{true}}">
                <span style="display: flex; gap: 2px" aria-label="{{d.groupsLabel}}">
                  <span style="width: 12px; height: 12px; border-radius: 3px; background: #EF4444"></span>
                  <span style="width: 12px; height: 12px; border-radius: 3px; background: #3B82F6"></span>
                </span>
              </sc-if>
            </span>
          </div>
          <div role="group" aria-label="{{d.durLabel}}" style="display: flex; align-items: center; border-radius: 12px; border: 2px solid {{t.line}}">
            <button type="button" aria-label="5 Minuten weniger" onClick="{{d.dec}}" style="width: 36px; height: 40px; border: 0; background: none; color: {{t.ink}}; font-size: 20px; font-weight: 700; cursor: pointer">−</button>
            <span style="min-width: 30px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px">{{d.min}}</span>
            <button type="button" aria-label="5 Minuten mehr" onClick="{{d.inc}}" style="width: 36px; height: 40px; border: 0; background: none; color: {{t.ink}}; font-size: 20px; font-weight: 700; cursor: pointer">+</button>
          </div>
          <button type="button" aria-label="{{d.moreLabel}}" style="display: grid; place-items: center; width: 36px; height: 44px; border: 0; background: none; color: {{t.muted}}; cursor: pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
          </button>
        </li>
      </sc-for>
    </ol>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px; border: 2px dashed {{t.addLine}}; background: transparent; color: {{t.trainingText}}; font-family: Barlow, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Übung hinzufügen
    </button>
    <p style="margin: 0; text-align: center; font-size: 13px; color: {{t.muted}}">Kopieren, Vorlagen und Notizen unter ⋯</p>
  </main>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 24px; background: {{t.surface}}; border-top: 1px solid {{t.line}}">
    <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.2">
      <strong style="font-size: 15px">{{statusTitle}}</strong>
      <span style="font-size: 13px; color: {{t.muted}}">{{statusText}}</span>
    </div>
    <button type="button" onClick="{{togglePublish}}" style="min-height: 52px; padding: 0 20px; border-radius: 14px; border: 2px solid {{pubBorder}}; background: {{pubBg}}; color: {{pubFg}}; font-family: Barlow, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">{{pubLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
var THEMES = {
  light: { bg: '#EDF1EC', surface: '#FFFFFF', ink: '#0F1A14', muted: '#55625A', line: '#D7DED5', track: '#DDE4DB', segOn: '#FFFFFF', pitch: '#0B4A30', accent: '#15803D', trainingText: '#166534', addLine: '#8DB89C', warnText: '#92400E', okText: '#166534', warnBar: '#B45309', okBar: '#15803D' },
  dark: { bg: '#0A110D', surface: '#141D18', ink: '#E7EEE9', muted: '#9DAEA3', line: '#2B3A31', track: '#1C2721', segOn: '#2A3A30', pitch: '#0E4B32', accent: '#3CCF72', trainingText: '#4ADE80', addLine: '#2F6B45', warnText: '#FBBF24', okText: '#4ADE80', warnBar: '#F59E0B', okBar: '#3CCF72' }
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { seg: 1, mins: [10, 15, 25], published: false };
  }
  renderVals() {
    var self = this;
    var t = this.props.dark ? THEMES.dark : THEMES.light;
    var dark = !!this.props.dark;
    var total = this.state.mins.reduce(function (a, b) { return a + b; }, 0);
    var fits = total >= 80 && total <= 90;
    var over = total > 90;
    var segs = ['Infos', 'Plan', 'Gruppen', 'Wer kommt'].map(function (label, i) {
      var on = self.state.seg === i;
      return { label: label, on: on, pick: function () { self.setState({ seg: i }); }, bg: on ? t.segOn : 'transparent', fg: t.ink, weight: on ? 700 : 500, shadow: on ? '0 1px 3px rgba(0,0,0,0.15)' : 'none' };
    });
    var base = [
      { title: 'Aufwärmen mit Ball', cat: 'Aufwärmen', hasGroups: false },
      { title: 'Rondo 4 gegen 2', cat: 'Ballbesitz', hasGroups: true },
      { title: 'Abschlussspiel 7 gegen 7', cat: 'Spielform', hasGroups: true }
    ];
    var drills = base.map(function (d, i) {
      var m = self.state.mins[i];
      var set = function (delta) {
        var mins = self.state.mins.slice();
        mins[i] = Math.max(5, Math.min(60, mins[i] + delta));
        self.setState({ mins: mins });
      };
      return {
        title: d.title, cat: d.cat, hasGroups: d.hasGroups, min: m,
        groupsLabel: 'Gruppen Rot und Blau',
        durLabel: 'Dauer ' + d.title + ': ' + m + ' Minuten',
        moveLabel: d.title + ' verschieben',
        moreLabel: 'Aktionen für ' + d.title,
        dec: function () { set(-5); }, inc: function () { set(5); }
      };
    });
    var pub = this.state.published;
    return {
      t: t,
      segs: segs,
      drills: drills,
      total: total,
      barWidth: Math.min(100, Math.round(total / 90 * 100)) + '%',
      fitText: over ? (total - 90) + ' Min. zu lang' : fits ? 'passt' : 'noch ' + (90 - total) + ' Min. frei',
      fitColor: fits ? t.okText : t.warnText,
      fitBar: fits ? t.okBar : t.warnBar,
      statusTitle: pub ? 'Veröffentlicht' : 'Entwurf',
      statusText: pub ? 'Spieler sehen den Plan' : 'Nur Trainer sehen den Plan',
      pubLabel: pub ? 'Zurückziehen' : 'Veröffentlichen',
      pubBg: pub ? 'transparent' : t.accent,
      pubFg: pub ? t.ink : (dark ? '#06140C' : '#FFFFFF'),
      pubBorder: pub ? t.line : t.accent,
      togglePublish: function () { self.setState({ published: !pub }); }
    };
  }
}
</script>
</body>
</html>
